services:
  postgres:
    image: postgres:16
    container_name: reserve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reserve
      POSTGRES_PASSWORD: reserve123
      POSTGRES_DB: reserve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: reserve-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
